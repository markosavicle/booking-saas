services:
  app:
    build: &php-build
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: ${CONTAINER_PREFIX:-booking}-app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - booking-net
    depends_on:
      permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started

  # One-shot, runs on every `docker compose up`: hands anything in the writable dirs that a
  # root or legacy-UID process left behind back to www-data (= the host user), then exits.
  permissions:
    build: *php-build
    user: root
    restart: 'no'
    volumes:
      - ./src:/var/www/html
    command: >-
      sh -c 'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache
      && find storage bootstrap/cache \( ! -user www-data -o ! -group www-data \) -exec chown -h www-data:www-data {} +
      && find storage bootstrap/cache -type d ! -perm -u=rwx -exec chmod u+rwx {} +'

  # Frontend tooling as the host user, so public/build is never root-owned:
  #   docker compose run --rm node npm ci && docker compose run --rm node npm run build
  node:
    image: node:22-alpine
    profiles: [tools]
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    working_dir: /app
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - ./src:/app

  webserver:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-booking}-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8090}:80'
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - booking-net
      - nginx-net
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_PREFIX:-booking}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - booking-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - booking-net

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-booking}-redis
    restart: unless-stopped
    networks:
      - booking-net

  mailpit:
    image: axllent/mailpit
    container_name: ${CONTAINER_PREFIX:-booking}-mailpit
    restart: unless-stopped
    environment:
      # Without a database path Mailpit keeps messages in a temp file that dies with the container.
      MP_DATABASE: /data/mailpit.db
    volumes:
      - booking-mailpit-data:/data
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    networks:
      - booking-net
      - nginx-net
  queue:
    build: *php-build
    container_name: ${CONTAINER_PREFIX:-booking}-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./src:/var/www/html
    networks:
      - booking-net
    depends_on:
      permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started

  scheduler:
    build: *php-build
    container_name: ${CONTAINER_PREFIX:-booking}-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www/html
    networks:
      - booking-net
    depends_on:
      permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_started
      redis:
        condition: service_started

networks:
  booking-net:
    driver: bridge
  nginx-net:
    external: true

volumes:
  booking-mysql-data:
  booking-mailpit-data:
