name: Deploy Booking SaaS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deploys against the same stack at once; let a running one finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: self-hosted
    env:
      # Dedicated clone + compose project. The dev checkout (~/docker/booking-saas)
      # and its containers/volumes are never touched by this workflow.
      DEPLOY_PATH: /home/markoserver/docker/production-booking-saas
      COMPOSE_PROJECT_NAME: booking-prod
    steps:
      - name: Deploy ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ ! -d "$DEPLOY_PATH/.git" ] || [ ! -f "$DEPLOY_PATH/.env" ] || [ ! -f "$DEPLOY_PATH/src/.env" ]; then
            echo "::error::$DEPLOY_PATH is not bootstrapped (needs a git clone plus .env and src/.env). See the README deploy section."
            exit 1
          fi
          cd "$DEPLOY_PATH"

          # A bare `docker compose` in this folder must hit the same project as this workflow,
          # or it creates a second project (named after the folder) that steals our container names.
          pinned="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env | tail -n1)"
          if [ "$pinned" != "$COMPOSE_PROJECT_NAME" ]; then
            echo "::error::$DEPLOY_PATH/.env must contain COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME (found '${pinned:-nothing}')."
            exit 1
          fi

          # Without a key every request is a 500 ("No application encryption key has been specified").
          if ! grep -q '^APP_KEY=base64:.' src/.env; then
            echo "::error::APP_KEY is empty in $DEPLOY_PATH/src/.env. Run: docker compose exec app php artisan key:generate --force"
            exit 1
          fi

          # Build the PHP image with www-data remapped to the runner user, so every process
          # in the stack owns what it writes (see docker/php/Dockerfile).
          export HOST_UID="$(id -u)" HOST_GID="$(id -g)"

          dc() { docker compose "$@"; }
          artisan() { dc exec -T app php artisan "$@"; }

          # Maintenance mode with the *old* code while we swap; always lift it again.
          if [ -n "$(dc ps -q --status running app)" ]; then
            artisan down --retry=60 || true
          fi
          trap 'artisan up || true' EXIT

          # Deploy exactly the commit that passed CI (not whatever origin/main is by now).
          # Only tracked files are reset; ignored files (.env, vendor, storage) survive.
          git fetch --prune origin
          git reset --hard "$GITHUB_SHA"
          git clean -fd

          # container_name is fixed, so a container another compose project left behind blocks
          # `up` with "name already in use". Clear stopped ones; never touch a running one.
          for name in $(dc config | sed -n 's/^ *container_name: *//p'); do
            project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$name" 2>/dev/null)" || continue
            [ "$project" = "$COMPOSE_PROJECT_NAME" ] && continue

            if [ "$(docker inspect -f '{{ .State.Running }}' "$name")" = true ]; then
              echo "::error::Container $name is running under compose project '${project:-none}'. Stop it by hand, then re-run the deploy."
              exit 1
            fi
            echo "::warning::Removing stopped container $name left by compose project '${project:-none}' (volumes are kept)."
            docker rm "$name"
          done

          # --build: rebuild images from the new Dockerfiles. --remove-orphans: drop containers of
          # services that were removed from this project's compose file.
          dc up -d --build --remove-orphans
          # nginx reads docker/nginx only at start, so a changed config needs a restart to apply.
          dc restart webserver
          dc up -d --wait mysql redis

          # `up` already ran the one-shot permissions service; repeat it explicitly so a deploy
          # never continues on a tree a root or old-UID process left behind.
          dc run --rm --no-deps permissions
          dc exec -T app composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

          # public/build is not committed; build it in a throwaway Node container.
          dc run --rm node sh -c 'npm ci --no-audit --no-fund && npm run build'

          artisan storage:link
          artisan migrate --force
          # Drop every cache built from the old code, then rebuild them for the new one.
          artisan optimize:clear
          artisan optimize
          artisan filament:optimize
          # Workers finish their current job and exit; restart: unless-stopped brings them back on the new code.
          artisan queue:restart
