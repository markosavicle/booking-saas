# X-Forwarded-* is honoured only from nginx-proxy-manager on the shared nginx-net network.
# Port 80 is also published on the host, so anyone hitting it directly could otherwise spoof
# their IP (defeating the OTP/cancel rate limits) or scheme. Keep in step with nginx-net's subnet.
geo $from_edge_proxy {
    default 0;
    172.19.0.0/16 1;
}

# X-Real-IP, not X-Forwarded-For: NPM appends to a client-sent X-Forwarded-For, and LAN clients
# sit in the private ranges Laravel trusts, so the spoofed entry would win.
map $from_edge_proxy $trusted_forwarded_for {
    1 $http_x_real_ip;
    default "";
}

map $from_edge_proxy $trusted_forwarded_proto {
    1 $http_x_forwarded_proto;
    default "";
}

server {
    listen 80;
    index index.php index.html;
    # Livewire file uploads; keep in step with docker/php/uploads.ini post_max_size.
    client_max_body_size 10M;
    root /var/www/html/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolve `app` per request via Docker's DNS: a rebuilt app container gets a new IP,
        # and a static upstream would 502 until nginx itself restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Replace whatever the client sent; Laravel trusts these (bootstrap/app.php).
        fastcgi_param HTTP_X_FORWARDED_FOR $trusted_forwarded_for if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $trusted_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
    }

    location ~ /\.ht {
        deny all;
    }
}
