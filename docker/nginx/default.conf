# X-Forwarded-* is honoured only from nginx-proxy-manager on the shared nginx-net network.
# Port 80 is also published on the host, so anyone hitting it directly could otherwise spoof
# their IP (defeating the OTP/cancel rate limits) or scheme. Keep in step with nginx-net's subnet.
geo $from_edge_proxy {
    default 0;
    172.19.0.0/16 1;
}

# X-Real-IP, not X-Forwarded-For: NPM appends to a client-sent X-Forwarded-For, and LAN clients
# sit in the private ranges Laravel trusts, so the spoofed entry would win.
map $from_edge_proxy $trusted_forwarded_for {
    1 $http_x_real_ip;
    default "";
}

map $from_edge_proxy $trusted_forwarded_proto {
    1 $http_x_forwarded_proto;
    default "";
}

# Direct and Nginx Proxy Manager traffic (the published WEB_PORT).
server {
    listen 80;
    set $client_ip $trusted_forwarded_for;
    set $client_proto $trusted_forwarded_proto;
    include /etc/nginx/conf.d/laravel.inc;
}

# Cloudflare Tunnel traffic (docs/deployment.md). Not published on the host, so only containers
# on this stack's Docker networks can reach it. Cloudflare's edge overwrites CF-Connecting-IP with
# the real client address, which keeps per-IP rate limits per visitor instead of one bucket for
# the tunnel, and TLS always ends at Cloudflare.
server {
    listen 8080;
    set $client_ip $http_cf_connecting_ip;
    set $client_proto https;
    include /etc/nginx/conf.d/laravel.inc;
}
